<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitHub Portfolio Analyzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

   <body>

    <div class="container">
        <div class="card">
            <h1>GitHub Portfolio Analyzer</h1>
            <p class="subtitle">
                Analyze your GitHub profile like a recruiter.
                Get a structured score and improvement insights.
            </p>

            <form id="githubForm">
                <input 
                    type="url" 
                    id="githubUrl" 
                    placeholder="https://github.com/username"
                    required
                >
                <button type="submit">Analyze Profile</button>
            </form>

            <div id="result"></div>
        </div>
    </div>

</body>

</body>
</html>
