<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitHub Portfolio Analyzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="card">
            <h2>GitHub Portfolio Analyzer</h2>
            <form id="githubForm">
                <input type="text" id="githubUrl" placeholder="Enter GitHub Username">
                <button type="submit">Analyze Profile</button>
            </form>
        </div>

        <div id="result" class="card"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
