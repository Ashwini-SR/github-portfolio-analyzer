<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitHub Portfolio Analyzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header Section -->
        <div class="card header-card">
            <h1>GitHub Portfolio Analyzer</h1>
            <p class="subtitle">
                Turn GitHub Repositories into Recruiter-Ready Proof
            </p>

            <form id="githubForm" class="form">
                <input 
                    type="text" 
                    id="githubUrl" 
                    placeholder="Enter GitHub Username (e.g., torvalds)"
                    required
                >
                <button type="submit">Analyze Profile</button>
            </form>

            <p id="loading" class="loading-text" style="display: none;">
                Analyzing profile...
            </p>
        </div>

        <!-- Results Section -->
        <div id="result" class="card result-card" style="display: none;">
            <!-- Dynamic content will be injected here -->
        </div>

    </div>

    <script src="script.js" defer></script>
</body>
</html>
